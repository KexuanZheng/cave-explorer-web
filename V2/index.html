<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Cave Explorer Web</title>
    <style>
        body { background: #222; color: #fff; font-family: monospace; display: flex; flex-direction: column; align-items: center; }
        #game-board {
            display: grid;
            grid-template-columns: repeat(20, 30px);
            grid-template-rows: repeat(12, 30px);
            gap: 2px;
            background: #444;
            padding: 5px;
            border: 2px solid #666;
        }
        .cell { width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; font-size: 20px; }
        .wall { background: #555; }
        .empty { background: #111; }
        .player { background: #00ff00; border-radius: 50%; }
        .gold { color: gold; }
        .snake { color: red; }
    </style>
</head>
<body>
    <h1>Cave Explorer</h1>
    <div>Current Gold: <span id="gold">0</span></div>
    <br>
    <div id="game-board"></div>
    <br>
    <div>Use W A S D to move</div>

    <script src="game.js"></script>
</body>
</html>
